<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solsticio · arquitectura de persistencia políglota</title>
  <!-- Estilo del documento de la Entrega 2: fondo blanco, texto negro, Calibri y verdes de las tablas. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Calibri, Carlito, "Segoe UI", sans-serif; background: #ffffff; color: #000000; padding: 2rem; }
    .frame { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; }
    .diagram-container { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow: visible; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Arquitectura de persistencia políglota</h1>
    <div class="diagram-container">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc"
         font-family="Calibri, Carlito, 'Segoe UI', sans-serif">
      <title id="arquitectura-title">Arquitectura de persistencia políglota de Solsticio</title>
      <desc id="arquitectura-desc">Los clientes llaman a la API Flask, que guarda los datos transaccionales en MySQL y los dinámicos en MongoDB; ambas bases se enlazan por identificador.</desc>
      <defs>
        <marker id="arquitectura-flecha" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#404040"/></marker>
      </defs>
      <rect width="1000" height="540" fill="#ffffff"/>

      <!-- Conectores (antes que las cajas) -->
      <line x1="500" y1="112" x2="500" y2="168" stroke="#404040" stroke-width="1.4" marker-end="url(#arquitectura-flecha)"/>
      <path d="M 432,284 V 314 Q 432,322 424,322 H 238 Q 230,322 230,330 V 356" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#arquitectura-flecha)"/>
      <path d="M 568,284 V 314 Q 568,322 576,322 H 762 Q 770,322 770,330 V 356" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#arquitectura-flecha)"/>
      <line x1="400" y1="420" x2="600" y2="420" stroke="#404040" stroke-width="1.2" stroke-dasharray="5,4"/>

      <!-- Etiquetas de conectores -->
      <rect x="510" y="133" width="90" height="14" rx="2" fill="#ffffff"/>
      <text x="514" y="144" fill="#000000" font-size="11" letter-spacing="0.06em">HTTP + JWT</text>
      <rect x="262" y="300" width="128" height="14" rx="2" fill="#ffffff"/>
      <text x="326" y="311" fill="#000000" font-size="11" text-anchor="middle" letter-spacing="0.06em">TRANSACCIONES</text>
      <rect x="610" y="300" width="128" height="14" rx="2" fill="#ffffff"/>
      <text x="674" y="311" fill="#000000" font-size="11" text-anchor="middle" letter-spacing="0.06em">DOCUMENTOS</text>
      <rect x="436" y="396" width="128" height="14" rx="2" fill="#ffffff"/>
      <text x="500" y="407" fill="#000000" font-size="11" text-anchor="middle" letter-spacing="0.06em">ENLACE POR ID</text>

      <!-- Clientes -->
      <rect x="340" y="40" width="320" height="72" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="356" y="60" fill="#404040" font-size="10" letter-spacing="0.12em">CLIENTES</text>
      <text x="356" y="80" fill="#000000" font-size="16" font-weight="700">Tienda web, panel y Postman</text>
      <text x="356" y="99" fill="#404040" font-size="12.5">Páginas en web/ que consumen /api/v1 con fetch</text>

      <!-- API (foco) -->
      <rect x="300" y="172" width="400" height="112" rx="6" fill="#E2EFD9" stroke="#548235" stroke-width="2.4"/>
      <text x="316" y="194" fill="#000000" font-size="10" font-weight="700" letter-spacing="0.12em">API REST · FLASK · /api/v1</text>
      <text x="316" y="215" fill="#000000" font-size="16" font-weight="700">Solsticio API</text>
      <text x="316" y="238" fill="#000000" font-size="12.5">rutas → servicios → serializadores</text>
      <text x="316" y="257" fill="#000000" font-size="12.5">after_request: cada petición con token queda en la bitácora</text>
      <text x="316" y="276" fill="#000000" font-size="12.5">endpoints combinados: leen de MySQL y de MongoDB</text>

      <!-- MySQL -->
      <rect x="60" y="360" width="340" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <path d="M 66,360 H 394 Q 400,360 400,366 V 400 H 60 V 366 Q 60,360 66,360 Z" fill="#EDEDED"/>
      <line x1="60" y1="400" x2="400" y2="400" stroke="#A6A6A6"/>
      <text x="76" y="376" fill="#404040" font-size="10" letter-spacing="0.12em">BASE RELACIONAL</text>
      <text x="76" y="393" fill="#000000" font-size="16" font-weight="700">MySQL 8.0 (SQLAlchemy)</text>
      <text x="76" y="422" fill="#000000" font-size="12.5">producto, variante, stock, pedido</text>
      <text x="76" y="442" fill="#000000" font-size="12.5">pago, factura, usuario, sede</text>
      <text x="76" y="462" fill="#404040" font-size="12.5">transacciones ACID y llaves foráneas</text>

      <!-- MongoDB -->
      <rect x="600" y="360" width="340" height="120" rx="6" fill="#E2EFD9" stroke="#000000" stroke-width="1"/>
      <path d="M 606,360 H 934 Q 940,360 940,366 V 400 H 600 V 366 Q 600,360 606,360 Z" fill="#A8D08D"/>
      <line x1="600" y1="400" x2="940" y2="400" stroke="#A6A6A6"/>
      <text x="616" y="376" fill="#000000" font-size="10" letter-spacing="0.12em">BASE DOCUMENTAL</text>
      <text x="616" y="393" fill="#000000" font-size="16" font-weight="700">MongoDB (PyMongo)</text>
      <text x="616" y="422" fill="#000000" font-size="12.5">actividad_usuario, escaneos_qr</text>
      <text x="616" y="442" fill="#000000" font-size="12.5">resenas_producto, fichas_producto</text>
      <text x="616" y="462" fill="#404040" font-size="12.5">esquema flexible, TTL y agregaciones</text>

      <!-- Leyenda -->
      <line x1="60" y1="500" x2="940" y2="500" stroke="#A6A6A6" stroke-width="0.8"/>
      <g font-size="12" fill="#000000">
        <text x="60" y="524" font-size="10.5" font-weight="700" letter-spacing="0.14em">LEYENDA</text>
        <rect x="140" y="514" width="16" height="12" rx="2" fill="#E2EFD9" stroke="#548235" stroke-width="2"/><text x="162" y="525">Punto central</text>
        <rect x="270" y="514" width="16" height="12" rx="2" fill="#EDEDED" stroke="#000000"/><text x="292" y="525">MySQL</text>
        <rect x="360" y="514" width="16" height="12" rx="2" fill="#A8D08D" stroke="#000000"/><text x="382" y="525">MongoDB</text>
        <line x1="470" y1="520" x2="500" y2="520" stroke="#404040" stroke-width="1.4" marker-end="url(#arquitectura-flecha)"/><text x="508" y="525">Llamada</text>
        <line x1="590" y1="520" x2="620" y2="520" stroke="#404040" stroke-width="1.2" stroke-dasharray="5,4"/><text x="628" y="525">Enlace por identificador (sin llave foránea entre bases)</text>
      </g>
    </svg>
    </div>
  </div>
</body>
</html>
