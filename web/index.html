<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Solsticio</title>
  <meta name="description" content="Catálogo de Solsticio: mira qué prendas hay en tu sede de Bogotá y en qué tallas.">
  <link rel="icon" href="/recursos/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/recursos/fuentes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/recursos/css/estilos.css">
  <script type="module" src="/recursos/js/catalogo.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Ir al contenido</a>
  <header class="cabecera" data-cabecera></header>

  <main class="contenedor" id="contenido">
    <div class="catalogo">
      <aside class="filtros" aria-label="Filtros">
        <button class="filtros__abrir boton boton--secundario" type="button" id="boton-filtros" aria-expanded="false" aria-controls="cuerpo-filtros">Filtrar</button>
        <div class="filtros__cuerpo" id="cuerpo-filtros">
        <fieldset>
          <legend>Disponibilidad</legend>
          <div class="filtros__opciones">
            <label><input type="checkbox" id="solo-disponibles"> Solo lo que hay en mi sede</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Categoría</legend>
          <div class="filtros__opciones" id="filtro-categoria">
            <label><input type="radio" name="categoria" value="" checked> Todas</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Para</legend>
          <div class="filtros__opciones" id="filtro-genero">
            <label><input type="radio" name="genero" value="" checked> Todos</label>
            <label><input type="radio" name="genero" value="MUJER"> Mujer</label>
            <label><input type="radio" name="genero" value="HOMBRE"> Hombre</label>
            <label><input type="radio" name="genero" value="UNISEX"> Unisex</label>
            <label><input type="radio" name="genero" value="INFANTIL"> Niños</label>
          </div>
        </fieldset>
        </div>
      </aside>

      <section aria-labelledby="titulo-catalogo">
        <h1 class="titulo-pagina" id="titulo-catalogo">Lo que hay hoy en tu sede</h1>
        <p class="subtitulo">Mira qué tallas hay para recoger hoy. Si cambias de sede arriba, el catálogo se actualiza.</p>
        <div class="resultado-cabecera">
          <p id="conteo" aria-live="polite"></p>
          <p id="busqueda-activa"></p>
        </div>
        <div id="resultados"><p class="cargando">Cargando prendas…</p></div>
        <div class="mas" id="zona-mas"></div>
      </section>
    </div>
  </main>

  <footer class="pie">
    <p>Solsticio, tiendas en Chapinero, Centro y Suba (Bogotá). <a href="/panel">Acceso del personal</a></p>
  </footer>
</body>
</html>
